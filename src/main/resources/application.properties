spring.application.name=oneday-class

# MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/oneday_class_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

#MyBtis Mapper XML
mybatis.mapper-locations=classpath:mapper/*.xml

# Kakao Map REST API
kakao.rest-api-key=${KAKAO_REST_API_KEY}

# AWS S3
aws.s3.bucket=activeon-class-images-2026-leejunoh
aws.s3.region=ap-northeast-2

# ==============================
# Multipart Upload
# ==============================

# 파일 1개 최대 크기
spring.servlet.multipart.max-file-size=10MB

# 한 요청 전체 최대 크기
# 이미지 최대 5장 x 10MB
spring.servlet.multipart.max-request-size=50MB