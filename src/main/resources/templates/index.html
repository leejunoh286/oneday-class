<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('새로운 취미의 시작')}"></head>

<body>

	<header th:replace="~{fragments/layout :: header}"></header>

	<main id="main-content" class="shell page">

		<section class="hero" aria-labelledby="hero-title">

			<div class="hero-copy">

				<span class="hero-kicker">
					취미를 시작하는 가장 가벼운 방법
				</span>

				<h1 id="hero-title">
					Get Active. Try Something New.
				</h1>

				<p>
					Find one-day classes near you and start today.
				</p>

				<a class="btn btn-primary"
				   th:href="@{/class/list}">
					클래스 둘러보기
					<span aria-hidden="true">↗</span>
				</a>

			</div>


			<div class="hero-art"
				 aria-hidden="true">

				<i></i>
				<b></b>
				<span></span>

			</div>

		</section>


		<section class="section"
				 aria-labelledby="category-title">

			<div class="section-heading">

				<div>

					<h2 id="category-title">
						관심 있는 클래스를 골라보세요
					</h2>

					<p>
						분야별로 원하는 하루 경험을 빠르게 찾아볼 수 있어요.
					</p>

				</div>

			</div>


			<div th:replace="~{fragments/components :: categories}">
			</div>

		</section>


		<section class="section"
				 aria-labelledby="latest-title">

			<div class="section-heading">

				<div>

					<h2 id="latest-title">
						새로 올라온 클래스
					</h2>

					<p>
						가볍게 시작할 수 있는 새로운 취미를 만나보세요.
					</p>

				</div>


				<a class="text-link"
				   th:href="@{/class/list}">

					전체 보기

					<span aria-hidden="true">
						↗
					</span>

				</a>

			</div>


			<div class="class-grid"
				 data-latest-url="/class/list?size=4"
				 th:attr="data-latest-url=@{/class/list(size=4)}"
				 aria-live="polite"
				 aria-busy="true">

				<p class="loading-state">
					새로운 클래스를 불러오고 있어요.
				</p>

			</div>


			<noscript>

				<p class="notice">

					클래스 목록에서 새로 등록된 클래스를 확인해주세요.

					<a th:href="@{/class/list}"
					   class="text-link">

						클래스 목록 보기 →

					</a>

				</p>

			</noscript>

		</section>

	</main>


	<footer th:replace="~{fragments/layout :: footer}">
	</footer>

</body>

</html>
