<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('처리 안내')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main id="main-content" class="shell page error-page">
		<section class="panel">
			<div class="auth-mark" aria-hidden="true">!</div>
			<h1>요청을 처리할 수 없어요</h1>
			<p th:text="${errorMessage}" role="alert">잠시 후 다시 시도해주세요.</p>
			<div class="actions">
				<a class="btn btn-primary" th:href="@{/class/list}">클래스 목록으로</a><a
					class="btn btn-outline" th:href="@{/}">홈으로</a>
			</div>
		</section>
	</main>
	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
