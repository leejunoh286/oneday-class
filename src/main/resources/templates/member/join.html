<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('회원가입')}"></head>
<body>
	<header th:replace="~{fragments/layout :: header}"></header>
	<main id="main-content" class="shell page auth-page">
		<div class="page-heading">
			<div class="auth-mark" aria-hidden="true">✦</div>
			<h1>새로운 하루를 시작해요</h1>
			<p>ActiveOn에 오신 것을 환영합니다.</p>
		</div>
		<form class="panel form-stack" th:action="@{/member/join}"
			th:object="${memberJoinDTO}" method="post">
			<div class="field">
				<label for="loginId">아이디</label><input class="form-control"
					type="text" th:field="*{loginId}" th:errorclass="is-invalid"
					aria-describedby="loginId-error" required minlength="4"
					maxlength="50" autocomplete="username" placeholder="4~50자로 입력해주세요">
				<p class="field-error" id="loginId-error"
					th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></p>
			</div>
			<div class="field">
				<label for="password">비밀번호</label><input class="form-control"
					type="password" th:field="*{password}" th:errorclass="is-invalid"
					aria-describedby="password-error" required minlength="8"
					maxlength="50" autocomplete="new-password"
					placeholder="8~50자로 입력해주세요">
				<p class="field-error" id="password-error"
					th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
			</div>
			<div class="field">
				<label for="name">이름</label><input class="form-control" type="text"
					th:field="*{name}" th:errorclass="is-invalid"
					aria-describedby="name-error" required maxlength="50"
					autocomplete="name">
				<p class="field-error" id="name-error"
					th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
			</div>
			<div class="field">
				<label for="nickname">닉네임</label><input class="form-control"
					type="text" th:field="*{nickname}" th:errorclass="is-invalid"
					aria-describedby="nickname-error" required minlength="2"
					maxlength="50" autocomplete="nickname">
				<p class="field-error" id="nickname-error"
					th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></p>
			</div>
			<div class="field">
				<label for="email">이메일</label><input class="form-control"
					type="email" th:field="*{email}" th:errorclass="is-invalid"
					aria-describedby="email-error" required maxlength="100"
					autocomplete="email" placeholder="hello@example.com">
				<p class="field-error" id="email-error"
					th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
			</div>
			<div class="field">
				<label for="phone">전화번호 (선택)</label><input class="form-control"
					type="tel" th:field="*{phone}" th:errorclass="is-invalid"
					aria-describedby="phone-error" maxlength="20"
					pattern="[0-9\-]{10,20}" autocomplete="tel"
					placeholder="010-1234-5678">
				<p class="field-error" id="phone-error"
					th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
			</div>
			<button class="btn btn-primary btn-block" type="submit">회원가입</button>
		</form>
		<p class="auth-bottom">
			이미 회원이신가요?<a class="text-link" th:href="@{/member/login}">로그인</a>
		</p>
	</main>
	<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
