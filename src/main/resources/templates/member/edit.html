<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('회원정보 수정')}"></head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>


<main id="main-content"
      class="shell page">

    <section class="panel">

        <span class="eyebrow">
            MY ACCOUNT
        </span>

        <h1>
            회원정보 수정
        </h1>

        <p class="muted">
            이름, 닉네임, 이메일, 전화번호를 수정할 수 있습니다.
        </p>

    </section>


    <section class="panel section">

        <form th:action="@{/member/edit}"
              th:object="${memberUpdateDTO}"
              method="post">


            <!-- 이름 -->
            <div class="form-group">

                <label for="name">
                    이름
                </label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       class="form-control">

                <p class="form-error"
                   th:if="${#fields.hasErrors('name')}"
                   th:errors="*{name}">
                </p>

            </div>


            <!-- 닉네임 -->
            <div class="form-group">

                <label for="nickname">
                    닉네임
                </label>

                <input type="text"
                       id="nickname"
                       th:field="*{nickname}"
                       class="form-control">

                <p class="form-error"
                   th:if="${#fields.hasErrors('nickname')}"
                   th:errors="*{nickname}">
                </p>

            </div>


            <!-- 이메일 -->
            <div class="form-group">

                <label for="email">
                    이메일
                </label>

                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control">

                <p class="form-error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>

            </div>


            <!-- 전화번호 -->
            <div class="form-group">

                <label for="phone">
                    전화번호
                </label>

                <input type="text"
                       id="phone"
                       th:field="*{phone}"
                       class="form-control"
                       placeholder="010-1234-5678">

                <p class="form-error"
                   th:if="${#fields.hasErrors('phone')}"
                   th:errors="*{phone}">
                </p>

            </div>


            <!-- 버튼 -->
            <div class="actions"
                 style="margin-top:24px;">

                <button type="submit"
                        class="btn btn-primary">

                    수정 완료

                </button>


                <a th:href="@{/member/mypage}"
                   class="btn btn-outline">

                    취소

                </a>

            </div>

        </form>

    </section>

</main>


<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
