<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('비밀번호 변경')}"></head>

<body>

<header th:replace="~{fragments/layout :: header}"></header>


<main id="main-content"
      class="shell page">

    <section class="panel">

        <span class="eyebrow">
            MY ACCOUNT
        </span>

        <h1>
            비밀번호 변경
        </h1>

        <p class="muted">
            현재 비밀번호를 확인한 뒤
            새로운 비밀번호로 변경할 수 있습니다.
        </p>

    </section>


    <section class="panel section">

        <form th:action="@{/member/password}"
              th:object="${passwordChangeDTO}"
              method="post">


            <!-- 현재 비밀번호 -->
            <div class="form-group">

                <label for="currentPassword">
                    현재 비밀번호
                </label>

                <input type="password"
                       id="currentPassword"
                       th:field="*{currentPassword}"
                       class="form-control">

                <p class="form-error"
                   th:if="${#fields.hasErrors('currentPassword')}"
                   th:errors="*{currentPassword}">
                </p>

            </div>


            <!-- 새 비밀번호 -->
            <div class="form-group">

                <label for="newPassword">
                    새 비밀번호
                </label>

                <input type="password"
                       id="newPassword"
                       th:field="*{newPassword}"
                       class="form-control">

                <p class="form-error"
                   th:if="${#fields.hasErrors('newPassword')}"
                   th:errors="*{newPassword}">
                </p>

            </div>


            <!-- 새 비밀번호 확인 -->
            <div class="form-group">

                <label for="confirmPassword">
                    새 비밀번호 확인
                </label>

                <input type="password"
                       id="confirmPassword"
                       th:field="*{confirmPassword}"
                       class="form-control">

                <p class="form-error"
                   th:if="${#fields.hasErrors('confirmPassword')}"
                   th:errors="*{confirmPassword}">
                </p>

            </div>


            <!-- Service 단계 오류 -->
            <p th:if="${passwordError}"
               th:text="${passwordError}"
               style="
                    color:#dc3545;
                    font-weight:600;
                    margin-top:16px;
               ">
            </p>


            <!-- 버튼 -->
            <div class="actions"
                 style="margin-top:24px;">

                <button type="submit"
                        class="btn btn-primary">

                    비밀번호 변경

                </button>


                <a th:href="@{/member/mypage}"
                   class="btn btn-outline">

                    취소

                </a>

            </div>

        </form>

    </section>

</main>


<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
