<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head('ActiveOn 관리자 대시보드')}">
</head>

<body>

<header th:replace="~{fragments/layout :: header}">
</header>


<main class="shell page">

    <!-- =====================================================
         관리자 페이지 제목
         ===================================================== -->
    <section class="panel">

        <span class="eyebrow">
            ADMIN
        </span>

        <h1>
            ActiveOn 관리자 대시보드
        </h1>

        <p class="muted">
            서비스 전체 현황과 주요 상태를 한눈에 확인할 수 있습니다.
        </p>

    </section>



    <!-- =====================================================
         기본 통계
         ===================================================== -->
    <section class="panel content-section">

        <h2>
            전체 현황
        </h2>


        <div style="
            display:grid;
            grid-template-columns:repeat(5, 1fr);
            gap:16px;
            margin-top:20px;
        ">


            <!-- 회원 수 -->
            <div style="
                border:1px solid #e0e0e0;
                border-radius:16px;
                padding:20px;
                background:#ffffff;
            ">

                <p class="muted">
                    전체 회원
                </p>

                <strong style="
                    display:block;
                    font-size:32px;
                    margin-top:8px;
                "
                th:text="${stats.memberCount}">
                    0
                </strong>

            </div>



            <!-- 클래스 수 -->
            <div style="
                border:1px solid #e0e0e0;
                border-radius:16px;
                padding:20px;
                background:#ffffff;
            ">

                <p class="muted">
                    전체 클래스
                </p>

                <strong style="
                    display:block;
                    font-size:32px;
                    margin-top:8px;
                "
                th:text="${stats.classCount}">
                    0
                </strong>

            </div>



            <!-- 신청 수 -->
            <div style="
                border:1px solid #e0e0e0;
                border-radius:16px;
                padding:20px;
                background:#ffffff;
            ">

                <p class="muted">
                    전체 신청
                </p>

                <strong style="
                    display:block;
                    font-size:32px;
                    margin-top:8px;
                "
                th:text="${stats.applicationCount}">
                    0
                </strong>

            </div>



            <!-- 댓글 수 -->
            <div style="
                border:1px solid #e0e0e0;
                border-radius:16px;
                padding:20px;
                background:#ffffff;
            ">

                <p class="muted">
                    전체 댓글
                </p>

                <strong style="
                    display:block;
                    font-size:32px;
                    margin-top:8px;
                "
                th:text="${stats.commentCount}">
                    0
                </strong>

            </div>



            <!-- 리뷰 수 -->
            <div style="
                border:1px solid #e0e0e0;
                border-radius:16px;
                padding:20px;
                background:#ffffff;
            ">

                <p class="muted">
                    전체 리뷰
                </p>

                <strong style="
                    display:block;
                    font-size:32px;
                    margin-top:8px;
                "
                th:text="${stats.reviewCount}">
                    0
                </strong>

            </div>

        </div>

    </section>



    <!-- =====================================================
         클래스 상태별 통계
         ===================================================== -->
    <section class="panel content-section">

        <h2>
            클래스 상태
        </h2>


        <div style="
            display:grid;
            grid-template-columns:repeat(3, 1fr);
            gap:16px;
            margin-top:20px;
        ">


            <!-- 모집중 -->
            <div style="
                border:1px solid #d9e9df;
                border-radius:16px;
                padding:20px;
                background:#f3faf6;
            ">

                <p>
                    모집중
                </p>

                <strong style="
                    display:block;
                    font-size:28px;
                    margin-top:8px;
                "
                th:text="${stats.recruitingCount}">
                    0
                </strong>

                <p class="form-help">
                    RECRUITING
                </p>

            </div>



            <!-- 모집마감 -->
            <div style="
                border:1px solid #e8e8e8;
                border-radius:16px;
                padding:20px;
                background:#fafafa;
            ">

                <p>
                    모집마감
                </p>

                <strong style="
                    display:block;
                    font-size:28px;
                    margin-top:8px;
                "
                th:text="${stats.closedCount}">
                    0
                </strong>

                <p class="form-help">
                    CLOSED
                </p>

            </div>



            <!-- 완료 -->
            <div style="
                border:1px solid #e8e8e8;
                border-radius:16px;
                padding:20px;
                background:#fafafa;
            ">

                <p>
                    완료
                </p>

                <strong style="
                    display:block;
                    font-size:28px;
                    margin-top:8px;
                "
                th:text="${stats.completedClassCount}">
                    0
                </strong>

                <p class="form-help">
                    COMPLETED
                </p>

            </div>

        </div>

    </section>



    <!-- =====================================================
         신청 상태별 통계
         ===================================================== -->
    <section class="panel content-section">

        <h2>
            신청 상태
        </h2>


        <div style="
            display:grid;
            grid-template-columns:repeat(5, 1fr);
            gap:16px;
            margin-top:20px;
        ">


            <!-- 대기 -->
            <div style="
                border:1px solid #e8e8e8;
                border-radius:16px;
                padding:18px;
                background:#ffffff;
            ">

                <p>
                    대기
                </p>

                <strong style="font-size:26px;"
                        th:text="${stats.pendingCount}">
                    0
                </strong>

                <p class="form-help">
                    PENDING
                </p>

            </div>



            <!-- 승인 -->
            <div style="
                border:1px solid #d9e9df;
                border-radius:16px;
                padding:18px;
                background:#f3faf6;
            ">

                <p>
                    승인
                </p>

                <strong style="font-size:26px;"
                        th:text="${stats.approvedCount}">
                    0
                </strong>

                <p class="form-help">
                    APPROVED
                </p>

            </div>



            <!-- 거절 -->
            <div style="
                border:1px solid #f0dddd;
                border-radius:16px;
                padding:18px;
                background:#fff8f8;
            ">

                <p>
                    거절
                </p>

                <strong style="font-size:26px;"
                        th:text="${stats.rejectedCount}">
                    0
                </strong>

                <p class="form-help">
                    REJECTED
                </p>

            </div>



            <!-- 취소 -->
            <div style="
                border:1px solid #e8e8e8;
                border-radius:16px;
                padding:18px;
                background:#fafafa;
            ">

                <p>
                    취소
                </p>

                <strong style="font-size:26px;"
                        th:text="${stats.cancelledCount}">
                    0
                </strong>

                <p class="form-help">
                    CANCELLED
                </p>

            </div>



            <!-- 완료 -->
            <div style="
                border:1px solid #e8e8e8;
                border-radius:16px;
                padding:18px;
                background:#fafafa;
            ">

                <p>
                    완료
                </p>

                <strong style="font-size:26px;"
                        th:text="${stats.completedApplicationCount}">
                    0
                </strong>

                <p class="form-help">
                    COMPLETED
                </p>

            </div>

        </div>

    </section>



    <!-- =====================================================
         관리자 바로가기
         ===================================================== -->
    <section class="panel content-section">

        <h2>
            관리 메뉴
        </h2>


        <div class="actions"
             style="margin-top:16px;">

            <a href="/admin/member/list"
               class="btn btn-outline">

                회원 관리

            </a>


            <a href="/admin/class/list"
               class="btn btn-outline">

                클래스 관리

            </a>

        </div>

    </section>

</main>


<footer th:replace="~{fragments/layout :: footer}">
</footer>

</body>
</html>
