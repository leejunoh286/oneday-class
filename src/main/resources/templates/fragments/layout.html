<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(pageTitle)">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color"
          content="#148653">

    <title th:text="${pageTitle + ' | ActiveOn'}">
        ActiveOn
    </title>

    <link rel="stylesheet"
          th:href="@{/css/vendor/bootstrap.min.css}">

    <link rel="stylesheet"
          th:href="@{/css/app.css}">

    <script defer
            th:src="@{/js/app.js}">
    </script>

</head>


<body>


    <!-- =====================================================
         공통 헤더
         ===================================================== -->
    <header class="site-header"
            th:fragment="header">


        <a class="skip-link"
           href="#main-content">
            본문 바로가기
        </a>


        <div class="shell header-inner">


            <!-- 로고 -->
            <a class="brand"
               th:href="@{/}"
               aria-label="ActiveOn 홈">

                ActiveOn

                <span class="brand-dot"></span>

            </a>



            <!-- =================================================
                 클래스 검색
                 ================================================= -->
            <form class="header-search"
                  th:action="@{/class/list}"
                  method="get"
                  role="search">


                <label class="visually-hidden"
                       for="header-keyword">

                    클래스 검색

                </label>


                <input id="header-keyword"
                       type="search"
                       name="keyword"
                       placeholder="관심 있는 클래스를 찾아보세요"
                       maxlength="200">


                <input type="hidden"
                       name="searchType"
                       value="TITLE_CONTENT">


                <button type="submit"
                        aria-label="검색">


                    <svg width="20"
                         height="20"
                         viewBox="0 0 24 24"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="1.8"
                         aria-hidden="true">

                        <circle cx="10.5"
                                cy="10.5"
                                r="6.5" />

                        <path d="m16 16 5 5" />

                    </svg>


                </button>


            </form>



            <!-- 모바일 메뉴 버튼 -->
            <button class="menu-toggle btn btn-soft"
                    type="button"
                    aria-controls="main-nav"
                    aria-expanded="false">

                메뉴

                <span aria-hidden="true">
                    ☰
                </span>

            </button>



            <!-- =================================================
                 네비게이션
                 ================================================= -->
            <nav id="main-nav"
                 class="main-nav"
                 aria-label="주 메뉴">


                <!-- 클래스 목록 -->
                <a th:href="@{/class/list}">
                    클래스 목록
                </a>


                <!-- 클래스 개설 -->
                <a th:href="@{/class/register}">
                    클래스 개설
                </a>



                <!-- =================================================
                     비로그인 사용자
                     ================================================= -->
                <th:block sec:authorize="isAnonymous()">


                    <a th:href="@{/member/login}">
                        로그인
                    </a>


                    <a class="nav-join"
                       th:href="@{/member/join}">
                        회원가입
                    </a>


                </th:block>



                <!-- =================================================
                     로그인 사용자
                     ================================================= -->
                <th:block sec:authorize="isAuthenticated()">


                    <!-- 마이페이지 -->
                    <a th:href="@{/member/mypage}">
                        마이페이지
                    </a>



                    <!-- =============================================
                         관리자에게만 보이는 메뉴
                         ============================================= -->
                    <a th:href="@{/admin}"
                       sec:authorize="hasRole('ADMIN')">

                        관리자 페이지

                    </a>



                    <!-- 로그인 사용자 닉네임 -->
                    <span class="nav-user">

                        <strong
                            sec:authentication="principal.nickname">
                        </strong>

                        님

                    </span>



                    <!-- 로그아웃 -->
                    <form th:action="@{/member/logout}"
                          method="post">


                        <button type="submit"
                                class="nav-logout">

                            로그아웃

                        </button>


                    </form>


                </th:block>


            </nav>


        </div>


    </header>



    <!-- =====================================================
         공통 푸터
         ===================================================== -->
    <footer class="site-footer"
            th:fragment="footer">


        <div class="shell footer-inner">


            <span>

                <strong>
                    ActiveOn
                </strong>

                · 새로운 스포츠를 시작하는 하루의 경험

            </span>


            <span>
                새로운 취미, 가까운 곳에서 만나요.
            </span>


        </div>


    </footer>


</body>
</html>
