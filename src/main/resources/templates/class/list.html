<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('클래스 둘러보기')}"></head>

<body>

	<header th:replace="~{fragments/layout :: header}"></header>

	<main id="main-content" class="shell page">

		<div class="page-heading">

			<span class="eyebrow">
				FIND YOUR DAY
			</span>

			<h1>
				어떤 하루를 만들어볼까요?
			</h1>

			<p>
				나에게 맞는 취미를 찾고, 새로운 경험을 시작해보세요.
			</p>

		</div>


		<form class="panel filter-bar"
			th:action="@{/class/list}"
			method="get"
			th:object="${searchDTO}"
			role="search">

			<div class="field">

				<label for="categoryId">
					카테고리
				</label>

				<select class="form-select"
					th:field="*{categoryId}">

					<option value="">
						전체 카테고리
					</option>

					<option value="1">
						테니스
					</option>

					<option value="2">
						풋살
					</option>

					<option value="3">
						농구
					</option>

					<option value="4">
						러닝
					</option>

					<option value="5">
						헬스
					</option>

					<option value="6">
						배드민턴
					</option>

					<option value="7">
						골프
					</option>

					<option value="8">
						수영
					</option>
					
					<option value="9">
						복싱
					</option>
					
					<option value="10">
						야구
					</option>

				</select>

			</div>


			<div class="field">

				<label for="searchType">
					검색 범위
				</label>

				<select class="form-select"
					th:field="*{searchType}">

					<option value="">
						제목 + 내용
					</option>

					<option value="TITLE">
						제목
					</option>

					<option value="CONTENT">
						내용
					</option>

					<option value="TITLE_CONTENT">
						제목 + 내용
					</option>

				</select>

			</div>


			<div class="field filter-keyword">

				<label for="keyword">
					검색어
				</label>

				<input type="search"
					class="form-control"
					th:field="*{keyword}"
					placeholder="배우고 싶은 취미를 검색해보세요"
					maxlength="200">

			</div>


			<button type="submit"
				class="btn btn-primary">

				검색하기

			</button>


			<a class="btn btn-outline"
				th:href="@{/class/list}">

				초기화

			</a>

		</form>


		<div class="section-heading">

			<p class="muted">

				총

				<strong class="text-link"
					th:text="${searchDTO.totalCount}">
					0
				</strong>

				개의 클래스

			</p>


			<a class="text-link"
				th:href="@{/class/register}">

				클래스 개설 ↗

			</a>

		</div>


		<!-- =========================================
		     클래스 목록
		     ========================================= -->
		<div id="class-results"
			class="class-grid">

			<th:block th:each="item : ${classList}">

				<article th:replace="~{fragments/components :: card(
					${item},
					${thumbnailMap[item.classId]}
				)}">
				</article>

			</th:block>

		</div>


		<!-- 검색 결과 없음 -->
		<div class="empty-state"
			th:if="${#lists.isEmpty(classList)}">

			<span class="empty-symbol"
				aria-hidden="true">
				⌕
			</span>

			<h2>
				검색 결과가 없어요
			</h2>

			<p>
				다른 검색어나 카테고리로 새로운 취미를 찾아보세요.
			</p>

			<a class="btn btn-soft"
				th:href="@{/class/list}">

				전체 클래스 보기

			</a>

		</div>


		<!-- =========================================
		     페이징
		     ========================================= -->
		<nav class="pagination-nav"
			aria-label="클래스 목록 페이지"
			th:if="${searchDTO.totalPages > 0}"
			th:with="
				start=${((searchDTO.page - 1) / 5) * 5 + 1},
				end=${T(java.lang.Math).min(start + 4, searchDTO.totalPages)}
			">


			<!-- 이전 -->
			<a class="page-link"
				th:if="${searchDTO.page > 1}"
				th:href="@{/class/list(
					page=${searchDTO.page - 1},
					size=${searchDTO.size},
					searchType=${searchDTO.searchType},
					keyword=${searchDTO.keyword},
					categoryId=${searchDTO.categoryId}
				)}"
				aria-label="이전 페이지">

				이전

			</a>


			<!-- 페이지 번호 -->
			<th:block th:each="n : ${#numbers.sequence(start, end)}">


				<span class="page-link active"
					aria-current="page"
					th:if="${n == searchDTO.page}"
					th:text="${n}">
				</span>


				<a class="page-link"
					th:unless="${n == searchDTO.page}"
					th:href="@{/class/list(
						page=${n},
						size=${searchDTO.size},
						searchType=${searchDTO.searchType},
						keyword=${searchDTO.keyword},
						categoryId=${searchDTO.categoryId}
					)}"
					th:text="${n}"
					th:attr="aria-label=${n + '페이지'}">
				</a>

			</th:block>


			<!-- 다음 -->
			<a class="page-link"
				th:if="${searchDTO.page < searchDTO.totalPages}"
				th:href="@{/class/list(
					page=${searchDTO.page + 1},
					size=${searchDTO.size},
					searchType=${searchDTO.searchType},
					keyword=${searchDTO.keyword},
					categoryId=${searchDTO.categoryId}
				)}"
				aria-label="다음 페이지">

				다음

			</a>

		</nav>

	</main>


	<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
