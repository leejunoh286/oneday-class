<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('클래스 수정')}"></head>

<body>

	<header th:replace="~{fragments/layout :: header}"></header>


	<main id="main-content" class="shell page form-page">


		<div class="page-heading">

			<span class="eyebrow">
				UPDATE YOUR CLASS
			</span>

			<h1>
				클래스 수정
			</h1>

			<p>
				클래스 정보와 이미지를 수정할 수 있어요.
			</p>

		</div>


		<form class="panel"
			th:action="@{/class/update}"
			th:object="${classUpdateDTO}"
			method="post"
			enctype="multipart/form-data"
			data-date-form>


			<!-- 수정 대상 클래스 ID -->
			<input type="hidden"
				th:field="*{classId}">


			<h2 class="form-section-title">
				클래스 기본 정보
			</h2>


			<div class="form-grid">


				<!-- 카테고리 -->
				<div class="field field-wide">

					<label for="categoryId">
						카테고리
					</label>

					<select class="form-select"
						th:field="*{categoryId}"
						th:errorclass="is-invalid"
						required
						aria-describedby="categoryId-error">

						<th:block
							th:replace="~{fragments/components :: categoryOptions}">
						</th:block>

					</select>


					<p class="field-error"
						id="categoryId-error"
						th:if="${#fields.hasErrors('categoryId')}"
						th:errors="*{categoryId}">
					</p>

				</div>


				<!-- 제목 -->
				<div class="field field-wide">

					<label for="title">
						클래스 제목
					</label>

					<input class="form-control"
						th:field="*{title}"
						th:errorclass="is-invalid"
						maxlength="200"
						required
						placeholder="클래스 제목을 입력해주세요."
						aria-describedby="title-error">


					<p id="title-error"
						class="field-error"
						th:if="${#fields.hasErrors('title')}"
						th:errors="*{title}">
					</p>

				</div>


				<!-- 소개 -->
				<div class="field field-wide">

					<label for="description">
						클래스 소개
					</label>

					<textarea class="form-control"
						th:field="*{description}"
						th:errorclass="is-invalid"
						rows="8"
						required
						placeholder="클래스 진행 내용과 준비물을 소개해주세요."
						aria-describedby="description-error"></textarea>


					<p id="description-error"
						class="field-error"
						th:if="${#fields.hasErrors('description')}"
						th:errors="*{description}">
					</p>

				</div>


				<!-- 가격 -->
				<div class="field">

					<label for="price">
						가격 (원)
					</label>

					<input class="form-control"
						type="number"
						th:field="*{price}"
						th:errorclass="is-invalid"
						aria-describedby="price-error"
						min="0"
						max="2147483647"
						required>


					<p class="field-error"
						id="price-error"
						th:if="${#fields.hasErrors('price')}"
						th:errors="*{price}">
					</p>


					<p class="form-help">
						무료 클래스는 0원을 입력해주세요.
					</p>

				</div>


				<!-- 모집 인원 -->
				<div class="field">

					<label for="capacity">
						모집 인원 (명)
					</label>

					<input class="form-control"
						type="number"
						th:field="*{capacity}"
						th:errorclass="is-invalid"
						aria-describedby="capacity-error"
						min="1"
						max="2147483647"
						required>


					<p class="field-error"
						id="capacity-error"
						th:if="${#fields.hasErrors('capacity')}"
						th:errors="*{capacity}">
					</p>

				</div>


				<!-- 진행 일시 -->
				<div class="field">

					<label for="classDate">
						클래스 진행 일시
					</label>

					<input class="form-control"
						type="datetime-local"
						th:field="*{classDate}"
						th:errorclass="is-invalid"
						aria-describedby="classDate-error"
						required>


					<p class="field-error"
						id="classDate-error"
						th:if="${#fields.hasErrors('classDate')}"
						th:errors="*{classDate}">
					</p>

				</div>


				<!-- 모집 마감 -->
				<div class="field">

					<label for="deadline">
						모집 마감 일시
					</label>

					<input class="form-control"
						type="datetime-local"
						th:field="*{deadline}"
						th:errorclass="is-invalid"
						aria-describedby="deadline-error"
						required>


					<p class="field-error"
						id="deadline-error"
						th:if="${#fields.hasErrors('deadline')}"
						th:errors="*{deadline}">
					</p>


					<p class="form-help">
						진행 일시보다 늦게 설정할 수 없어요.
					</p>

				</div>


				<!-- 장소 -->
				<div class="field field-wide">

					<label for="location">
						장소
					</label>

					<input class="form-control"
						th:field="*{location}"
						th:errorclass="is-invalid"
						maxlength="255"
						required
						placeholder="참여자가 찾아올 수 있는 장소를 입력해주세요."
						aria-describedby="location-error">


					<p id="location-error"
						class="field-error"
						th:if="${#fields.hasErrors('location')}"
						th:errors="*{location}">
					</p>

				</div>



				<!-- ===================================== -->
				<!-- 현재 등록된 이미지 -->
				<!-- ===================================== -->
				<div class="field field-wide">

					<label>
						현재 클래스 이미지
					</label>


					<p class="form-help"
						th:if="${classImages == null or classImages.isEmpty()}">

						현재 등록된 이미지가 없습니다.

					</p>


					<div th:if="${classImages != null and !classImages.isEmpty()}"
						style="
							display:flex;
							gap:16px;
							flex-wrap:wrap;
							margin-top:12px;
						">


						<div th:each="image, stat : ${classImages}"
							style="
								width:170px;
								padding:8px;
								border:1px solid #ddd;
								border-radius:12px;
								background:#fff;
							">


							<img th:src="${image.presignedUrl}"
								th:alt="${'클래스 이미지 ' + (stat.index + 1)}"
								style="
									width:100%;
									height:120px;
									object-fit:cover;
									border-radius:8px;
								">


							<!-- 대표 이미지 선택 -->
							<label style="
								display:flex;
								align-items:center;
								gap:6px;
								margin-top:8px;
								cursor:pointer;
							">
							
								<input type="radio"
									name="thumbnailImageId"
									th:value="${image.imageId}"
									th:checked="${image.thumbnail}">
							
								대표 이미지
							
							</label>
							
							
							<!-- 이미지 삭제 -->
							<label style="
								display:flex;
								align-items:center;
								gap:6px;
								margin-top:8px;
								cursor:pointer;
							">
							
								<input type="checkbox"
									name="deleteImageIds"
									th:value="${image.imageId}">
							
								삭제
							
							</label>

						</div>

					</div>

				</div>



				<!-- ===================================== -->
				<!-- 새 이미지 추가 -->
				<!-- ===================================== -->
				<div class="field field-wide">

					<label for="newImages">
						새 이미지 추가
					</label>


					<input class="form-control"
						type="file"
						id="newImages"
						name="newImages"
						accept="image/*"
						multiple>


					<p class="form-help">
						기존 이미지와 합쳐 최대 5장까지 등록할 수 있습니다.
						이미지 한 장당 최대 10MB입니다.
					</p>

				</div>


			</div>


			<div class="form-actions">


				<a class="btn btn-outline"
					th:href="@{/class/detail(classId=${classUpdateDTO.classId})}">

					취소

				</a>


				<button class="btn btn-primary"
					type="submit">

					수정 완료

				</button>

			</div>

		</form>

	</main>


	<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>

</html>
